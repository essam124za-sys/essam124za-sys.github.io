<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دردشة</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
window.OneSignalDeferred=window.OneSignalDeferred||[];
OneSignalDeferred.push(async function(OneSignal){
  await OneSignal.init({appId:"28729780-cb74-4609-9698-5c7b61404955",serviceWorkerPath:"/Shenouda-/sw.js",serviceWorkerParam:{scope:"/Shenouda-/"},notifyButton:{enable:false}});
});
</script>
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--soft:#F2F5F7;--ink:#14232B;--mute:#6B7A82;--line:#E3EAEE;--accent:#1F6F8B;--on:#fff;--err:#B3261E;--mine:#D4ECF4;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif}
.hidden{display:none!important}
.card{width:calc(100% - 40px);max-width:380px;margin:20px auto;border:1px solid var(--line);border-radius:16px;padding:26px 22px}
h1{margin:0 0 6px;font-size:26px;font-weight:800}
p.sub{margin:0 0 18px;color:var(--mute);font-size:15px}
label{display:block;font-weight:600;margin:14px 0 6px;font-size:15px}
input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);font:inherit;font-size:17px}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{direction:ltr;text-align:right}
.err{color:var(--err);min-height:22px;margin:10px 0 0;font-size:14px}
.note{color:var(--mute);font-size:13px;margin:12px 0 0}
button{padding:13px 16px;border:0;border-radius:10px;background:var(--accent);color:var(--on);font:inherit;font-weight:800;font-size:16px;cursor:pointer}
.full{width:100%;margin-top:10px}
.ghost{background:transparent;color:var(--mute);border:1px solid var(--line);font-weight:600}
#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;position:relative}
#top{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--bg);min-height:56px}
#title{flex:1;font-size:20px;font-weight:800}
.ic{background:transparent;color:var(--ink);padding:6px 10px;font-size:20px}
section{flex:1;min-height:0;display:flex;flex-direction:column}
#list{overflow-y:auto;flex:1}
.it{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:var(--bg);color:var(--ink);border-radius:0;border-bottom:1px solid var(--line);padding:12px 16px;font-weight:400}
.av{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--on);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;flex:none}
.tx{flex:1;min-width:0}
.tx b{display:block;font-size:16px}
.tx span{display:block;color:var(--mute);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it small{color:var(--mute);font-size:12px;flex:none}
.empty{color:var(--mute);text-align:center;padding:40px 24px}
.fab{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:20px;width:56px;height:56px;border-radius:50%;font-size:30px;padding:0;box-shadow:0 3px 10px rgba(0,0,0,.25)}
#newp{padding:12px 14px;border-bottom:1px solid var(--line);background:var(--soft)}
.row{display:flex;gap:8px}
#msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--soft)}
.m{max-width:80%;padding:9px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere}
.m.me{align-self:flex-end;background:var(--mine);border-color:transparent}
.m small{display:block;color:var(--mute);font-size:11px;margin-top:3px}
#bar{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--bg)}
.pad{padding:18px}
.set b{font-size:18px}
@media print{#top,#bar,.fab{display:none}html,body,#app{height:auto}#msgs{overflow:visible}}
</style>
</head>
<body>
<main id="auth" class="card hidden">
  <h1>أهلاً بيك</h1>
  <p class="sub">سجّل بالاسم والرقم والرقم السري. لو مسجل قبل كده، اكتب نفس بياناتك وهترجع لمحادثاتك.</p>
  <label for="name">الاسم</label>
  <input id="name" autocomplete="off" maxlength="30">
  <label for="phone">رقم الموبايل</label>
  <input id="phone" class="num" inputmode="numeric" autocomplete="off" maxlength="15">
  <label for="pin">رقم سري (٤ أرقام)</label>
  <input id="pin" class="num" inputmode="numeric" type="password" autocomplete="off" maxlength="4">
  <p class="err" id="err" role="alert"></p>
  <button id="ok" class="full">موافق</button>
  <p class="note">المشرف يراجع المحادثات المحفوظة للحماية من الإساءة.</p>
</main>

<div id="app" class="hidden">
  <header id="top"><button id="back" class="ic hidden" aria-label="رجوع">→</button><b id="title">المحادثات</b><button id="gear" class="ic" aria-label="الإعدادات">⚙️</button></header>

  <section id="listV">
    <div id="newp" class="hidden">
      <div class="row"><input id="peer" class="num" inputmode="numeric" maxlength="15" placeholder="رقم اللي عاوز تكلمه"><button id="go">فتح</button></div>
      <p class="err" id="e2" role="alert"></p>
    </div>
    <div id="list"></div>
    <button id="fab" class="fab" aria-label="محادثة جديدة">+</button>
  </section>

  <section id="chatV" class="hidden">
    <div id="msgs"></div>
    <div id="bar"><input id="txt" placeholder="اكتب رسالة" autocomplete="off" maxlength="2000"><button id="send">إرسال</button><button id="pdf" class="ghost">PDF</button></div>
  </section>

  <section id="setV" class="hidden pad set">
    <b id="sname"></b>
    <p class="sub" id="nst"></p>
    <button id="notif" class="full">🔔 تفعيل الإشعارات</button>
    <button id="out" class="full ghost">تسجيل الخروج</button>
  </section>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInAnonymously,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,writeBatch,collection,addDoc,query,orderBy,onSnapshot,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp({apiKey:"AIzaSyDjcXDMrxRWg9_ONbdYZziSBtVOSnjWY1Q",authDomain:"chat-a99b1.firebaseapp.com",projectId:"chat-a99b1",storageBucket:"chat-a99b1.firebasestorage.app",messagingSenderId:"457230137532",appId:"1:457230137532:web:f67a33493231010749f8b9"});
const auth=getAuth(app), db=getFirestore(app);
const $=i=>document.getElementById(i);
const toEn=s=>s.replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));
async function hash(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("dardasha:"+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
const PUSH_URL="https://dardasha-push.essam124za.workers.dev";
const OS=f=>{window.OneSignalDeferred=window.OneSignalDeferred||[];window.OneSignalDeferred.push(f)};
async function notify(id,text){
  if(!PUSH_URL)return;
  try{const tk=await auth.currentUser.getIdToken();
    fetch(PUSH_URL,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+tk},body:JSON.stringify({chatId:id,text:text.slice(0,120)})})}catch(e){}
}
let uid=null, me=null, unsubC=null, unsubI=null;

function view(v){["listV","chatV","setV"].forEach(i=>$(i).classList.toggle("hidden",i!==v));
  $("back").classList.toggle("hidden",v==="listV");$("gear").classList.toggle("hidden",v!=="listV")}
function stopChat(){if(unsubC){unsubC();unsubC=null}}
function fmt(ts){if(!ts)return"";const d=ts.toDate(),n=new Date();
  return d.toDateString()===n.toDateString()?d.toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"}):d.toLocaleDateString("ar-EG",{day:"numeric",month:"numeric"})}

function showAuth(){$("auth").classList.remove("hidden");$("app").classList.add("hidden")}
function showList(){
  stopChat();$("auth").classList.add("hidden");$("app").classList.remove("hidden");
  view("listV");$("title").textContent="المحادثات";
  if(unsubI)return;
  unsubI=onSnapshot(query(collection(db,"inbox",me.phone,"threads"),orderBy("t","desc")),s=>{
    const box=$("list");box.textContent="";
    if(s.empty){const e=document.createElement("div");e.className="empty";e.textContent="مفيش محادثات لسه. دوس + عشان تبدأ محادثة.";box.appendChild(e);return}
    s.forEach(d=>{const v=d.data(),b=document.createElement("button");b.className="it";
      b.innerHTML='<div class="av"></div><div class="tx"><b></b><span></span></div><small></small>';
      b.querySelector(".av").textContent=(v.name||"?").trim().charAt(0);
      b.querySelector("b").textContent=v.name||d.id;
      b.querySelector("span").textContent=v.last||"";
      b.querySelector("small").textContent=fmt(v.t);
      b.onclick=()=>openChat(d.id,v.name||d.id);box.appendChild(b)});
  },()=>{});
}

onAuthStateChanged(auth,async u=>{
  if(!u){await signInAnonymously(auth);return}
  uid=u.uid;
  try{
    const s=await getDoc(doc(db,"uids",uid));
    if(s.exists()){const p=s.data().phone;const n=await getDoc(doc(db,"names",p));me={phone:p,name:n.exists()?n.data().name:p};OS(o=>o.login(me.phone));showList();return}
  }catch(e){}
  showAuth();
});

$("ok").onclick=async()=>{
  const name=$("name").value.trim(),phone=toEn($("phone").value.trim()),pin=toEn($("pin").value.trim()),e=$("err");
  e.textContent="";
  if(!name){e.textContent="اكتب اسمك.";return}
  if(!/^\d{8,15}$/.test(phone)){e.textContent="اكتب رقم موبايل صحيح، أرقام بس.";return}
  if(!/^\d{4}$/.test(pin)){e.textContent="الرقم السري لازم ٤ أرقام.";return}
  $("ok").disabled=true;
  let exists=false;
  try{
    const nm=await getDoc(doc(db,"names",phone));exists=nm.exists();
    const ph=await hash(phone+":"+pin);
    if(exists){await setDoc(doc(db,"uids",uid),{phone,pinHash:ph});me={phone,name:nm.data().name}}
    else{const b=writeBatch(db);b.set(doc(db,"names",phone),{name});b.set(doc(db,"pins",phone),{pinHash:ph});b.set(doc(db,"uids",uid),{phone,pinHash:ph});await b.commit();me={phone,name}}
    OS(o=>o.login(me.phone));showList();
  }catch(x){e.textContent=exists?"الرقم ده مستخدم والرقم السري غلط.":"تعذّر التسجيل. جرّب تاني."}
  $("ok").disabled=false;
};

$("fab").onclick=()=>{$("newp").classList.toggle("hidden");$("peer").focus()};
$("go").onclick=async()=>{
  const p=toEn($("peer").value.trim()),e=$("e2");e.textContent="";
  if(!/^\d{8,15}$/.test(p)){e.textContent="اكتب رقم صحيح.";return}
  if(p===me.phone){e.textContent="ده رقمك إنت.";return}
  try{const n=await getDoc(doc(db,"names",p));if(!n.exists()){e.textContent="الرقم ده مش مسجل في التطبيق.";return}
    $("newp").classList.add("hidden");$("peer").value="";openChat(p,n.data().name)}
  catch(x){e.textContent="حصلت مشكلة. جرّب تاني."}
};

function openChat(p,n){
  stopChat();view("chatV");$("title").textContent=n;
  const id=[me.phone,p].sort().join("_"),box=$("msgs");box.textContent="";
  unsubC=onSnapshot(query(collection(db,"chats",id,"messages"),orderBy("t")),s=>{
    box.textContent="";
    s.forEach(d=>{
      const m=d.data(),el=document.createElement("div");
      el.className="m"+(m.from===me.phone?" me":"");
      el.textContent=m.text;
      const t=document.createElement("small");
      t.textContent=m.t?m.t.toDate().toLocaleString("ar-EG",{hour:"2-digit",minute:"2-digit",day:"numeric",month:"numeric"}):"";
      el.appendChild(t);box.appendChild(el);
    });
    box.scrollTop=box.scrollHeight;
  },()=>{box.textContent="تعذّر تحميل الرسائل."});
  const send=async()=>{
    const text=$("txt").value.trim();if(!text)return;$("txt").value="";
    try{
      await addDoc(collection(db,"chats",id,"messages"),{from:me.phone,text,t:serverTimestamp()});
      const b=writeBatch(db),last=text.slice(0,100);
      b.set(doc(db,"inbox",p,"threads",me.phone),{name:me.name,last,t:serverTimestamp()});
      b.set(doc(db,"inbox",me.phone,"threads",p),{name:n,last,t:serverTimestamp()});
      b.commit().catch(()=>{});
      notify(id,text);
    }catch(x){$("txt").value=text}
  };
  $("send").onclick=send;
  $("txt").onkeydown=ev=>{if(ev.key==="Enter")send()};
}

function permText(){$("nst").textContent=("Notification" in window)?(Notification.permission==="granted"?"الإشعارات: مفعّلة ✅":"الإشعارات: غير مفعّلة"):"الإشعارات غير مدعومة على الجهاز ده."}
$("gear").onclick=()=>{view("setV");$("title").textContent="الإعدادات";$("sname").textContent=me.name;permText()};
$("back").onclick=()=>showList();
$("notif").onclick=()=>OS(async o=>{await o.Notifications.requestPermission();permText()});
$("pdf").onclick=()=>window.print();
$("out").onclick=async()=>{stopChat();if(unsubI){unsubI();unsubI=null}OS(o=>o.logout());me=null;await signOut(auth)};
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
</body>
</html>
